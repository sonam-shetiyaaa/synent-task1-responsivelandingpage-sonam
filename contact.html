<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — StyleHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">Style<span>Hub</span></a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true" />
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="deals.html">Deals</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cart.html" class="nav-cart">Cart (0)</a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Get in Touch</p>
        <h1>Contact Us</h1>
        <p>We're here to help with orders, returns, and any questions.</p>
      </div>
    </section>

    <section class="contact-section">
      <div class="container contact-grid">
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-icon">📧</span>
            <div>
              <h3>Email</h3>
              <p>support@stylehub.com</p>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">📞</span>
            <div>
              <h3>Phone</h3>
              <p>+91 98765 43210</p>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">📍</span>
            <div>
              <h3>Address</h3>
              <p>123 Fashion Street, Mumbai, India</p>
            </div>
          </div>
        </div>

        <form class="contact-form" action="#" method="post">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>

          <button type="submit" class="button primary">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 StyleHub. All rights reserved.</p>
      <a href="index.html">← Back to Home</a>
    </div>
  </footer>
</body>
</html>
